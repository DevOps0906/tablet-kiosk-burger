<div style="border-top:2px dashed #B9A28F"></div>
<div style="display:flex;justify-content:space-between;font-weight:700"><span>더블불고기 라지세트</span><span>x1</span></div>
<div style="font-size:16px;color:#5C4536;padding-left:12px">· 양파 빼기 · 치즈 추가<br>· 감자튀김 L · 콜라 L</div>

<div style="flex:1"></div>

<div style="flex:none;width:100%;box-sizing:border-box;padding:0 32px 16px;text-align:center;font-size:19px;color:#7A5A48">20초 뒤 처음 화면으로 돌아가요</div>

<div style="flex:none;width:100%;box-sizing:border-box;padding:0 32px 36px;display:flex;gap:16px">
